# ---------------------------
# Spring Boot built-in properties
# ---------------------------
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/rosterdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: root123
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
    port: 8080

# ---------------------------
# Custom application properties
# Always put custom properties OUTSIDE 'spring:' to avoid duplicates
# ---------------------------
app:
  jwt:
    secret: REPLACE_WITH_STRONG_SECRET_KEY_AT_LEAST_32_BYTES
    expiration-ms: 86400000
  notifications:
    provider: console
    supervisor-email-from: supervisor@example.com